<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>気温リスクナビ</title>
    <link rel="stylesheet" href="./styles.css?v=20260618b" />
  </head>
  <body>
    <header class="app-header">
      <div class="title-lockup">
        <h1>気温リスクナビ</h1>
        <p id="datasetMeta">1996〜2025年・気象台等</p>
        <a class="guide-link" href="https://note.com/nature_wx_lab/n/n5727c83e2e30" target="_blank" rel="noopener noreferrer">
          <span class="guide-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 4.75A2.75 2.75 0 0 1 7.75 2H19v16.5h-9.75A2.25 2.25 0 0 0 7 20.75V21H5V4.75Z"></path>
              <path d="M7 5.25A1.25 1.25 0 0 1 8.25 4H17v12.5H9.25c-.82 0-1.6.27-2.25.76V5.25Z"></path>
              <path d="M9.25 7.25h5.5M9.25 10.25h5.5M9.25 13.25h3.5"></path>
            </svg>
          </span>
          <span>使い方</span>
        </a>
      </div>
      <div class="header-actions">
        <div class="brand">Nature Wx Lab</div>
        <nav class="sns-links" aria-label="Nature Wx Lab SNSリンク">
          <a class="sns-link youtube" href="https://www.youtube.com/@nature_wx_lab" target="_blank" rel="noopener noreferrer">
            <span class="sns-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="3" y="5" width="18" height="14" rx="4"></rect>
                <path d="M10 9v6l5-3z"></path>
              </svg>
            </span>
            <span>YouTube</span>
          </a>
          <a class="sns-link note" href="https://note.com/nature_wx_lab" target="_blank" rel="noopener noreferrer">
            <span class="sns-mark note-mark" aria-hidden="true">n</span>
            <span class="sns-name">note</span>
          </a>
          <a class="sns-link x" href="https://x.com/nature_wx_lab" target="_blank" rel="noopener noreferrer">
            <span class="sns-mark x-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect width="24" height="24"></rect>
                <path d="M13.9 10.5 21.4 2h-1.8l-6.5 7.4L7.9 2H2l7.8 11.1L2 22h1.8l6.8-7.8 5.4 7.8h5.9l-8-11.5Zm-2.4 2.7-.8-1.1L4.4 3.3h2.7l5.1 7.2.8 1.1 6.6 9.4h-2.7l-5.4-7.8Z"></path>
              </svg>
            </span>
            <span class="sns-name">X</span>
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="panel-toggles" aria-label="表示ブロックの切替">
        <button id="headerToggle" type="button" class="panel-toggle" aria-label="見出しを隠す" title="見出し">▴</button>
        <button id="controlsToggle" type="button" class="panel-toggle" aria-label="条件を隠す" title="条件">▴</button>
        <button id="summaryToggle" type="button" class="panel-toggle" aria-label="要約を隠す" title="要約">▴</button>
      </section>

      <section class="toolbar" aria-label="表示条件">
        <label class="control">
          <span>地方・都府県</span>
          <select id="regionSelect"></select>
        </label>
        <label class="control station-control">
          <span>地点</span>
          <select id="stationSelect"></select>
        </label>
        <label class="control search-control">
          <span>検索</span>
          <input id="stationSearch" type="search" autocomplete="off" placeholder="地点名" />
        </label>
        <div class="segmented" role="group" aria-label="気温要素">
          <button id="maxButton" type="button" data-element="max">最高気温</button>
          <button id="minButton" type="button" data-element="min">最低気温</button>
        </div>
        <label class="control threshold-control">
          <span>目安</span>
          <select id="thresholdSelect"></select>
        </label>
        <label class="control mode-control">
          <span>表示</span>
          <select id="viewModeSelect">
            <option value="stats">統計</option>
            <option value="year">単年</option>
          </select>
        </label>
        <label class="control period-control">
          <span>統計期間</span>
          <select id="periodSelect"></select>
        </label>
        <label class="control year-control">
          <span>年</span>
          <select id="yearSelect"></select>
        </label>
        <label class="control background-control">
          <span>背景統計</span>
          <select id="backgroundPeriodSelect"></select>
        </label>
        <div class="station-meta" aria-label="地点メタ情報">
          <div>
            <span class="label">位置</span>
            <strong id="stationPosition">--</strong>
          </div>
          <div>
            <span class="label">標高</span>
            <strong id="stationElevation">--</strong>
          </div>
          <div>
            <span class="label">block_no</span>
            <strong id="stationBlock">--</strong>
          </div>
        </div>
        <div class="overlay-controls" aria-label="重ね合わせ">
          <button id="thresholdMarkersButton" type="button" class="toggle">目安点</button>
          <button id="currentYearButton" type="button" class="toggle">今年の観測値を重ね表示</button>
          <button id="forecastButton" type="button" class="toggle">2週間気温予報を重ね表示</button>
        </div>
        <button id="downloadButton" type="button" class="command">PNG保存</button>
        <button id="copyButton" type="button" class="command">リンクコピー</button>
      </section>

      <section class="metric-grid" aria-label="統計サマリー">
        <div class="timing-panel">
          <div class="metric timing-card">
            <span class="label" id="riskLabel">実用目安</span>
            <strong id="riskMetric">--</strong>
          </div>
          <div class="metric timing-card">
            <span class="label" id="fallRiskLabel">実用目安</span>
            <strong id="fallRiskMetric">--</strong>
          </div>
        </div>
        <div class="stat-panel">
          <div class="metric stat-card">
            <span class="label" id="meanPeakLabel">平均のピーク</span>
            <strong id="meanPeak">--</strong>
          </div>
          <div class="metric stat-card">
            <span class="label" id="meanTroughLabel">平均の底</span>
            <strong id="meanTrough">--</strong>
          </div>
          <div class="metric stat-card">
            <span class="label" id="recordHighLabel">経験上限</span>
            <strong id="recordHigh">--</strong>
          </div>
          <div class="metric stat-card">
            <span class="label" id="recordLowLabel">経験下限</span>
            <strong id="recordLow">--</strong>
          </div>
        </div>
      </section>

      <section class="chart-shell" aria-label="日別気温統計グラフ">
        <canvas id="chartCanvas" width="1440" height="820"></canvas>
        <div id="chartScrollbars" class="chart-scrollbars" hidden>
          <div id="chartHScroll" class="chart-scrollbar chart-scrollbar-x" role="scrollbar" aria-label="表示範囲を左右に移動" aria-orientation="horizontal" tabindex="0">
            <div class="chart-scrollbar-thumb"></div>
          </div>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
      </section>

      <section class="details">
        <div class="legend-row">
          <span><i class="swatch range"></i>過去MAX〜MIN</span>
          <span><i class="swatch p1090"></i>10〜90%</span>
          <span><i class="swatch p2575"></i>25〜75%</span>
          <span><i class="line mean"></i>平均</span>
          <span><i class="line median"></i>中央値</span>
          <span><i class="marker-dot"></i>目安日</span>
        </div>
        <p id="statusText"></p>
      </section>
    </main>

    <footer class="app-footer">
      出典：気象庁「過去の気象データ検索」をもとに作成。グラフは観測データを独自に集計・可視化したものです。欠測は0扱いせず、有効値のみで集計しています。
    </footer>

    <script src="./app.js?v=20260618a" defer></script>
  </body>
</html>
